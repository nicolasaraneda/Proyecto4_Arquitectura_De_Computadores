# Integración continua del Proyecto 4.
# Grupo: Nicolás Araneda, Vicente Calderón y Santiago Muñoz.
#
# En cada push y en cada pull request se corre lo mismo que `make check`
# (tests del ensamblador y de la referencia, trade.hex al día, testbench
# oficial con 4/4), la equivalencia con la referencia en los 20 000 ticks con
# el gemelo digital y con Verilator, la validación del gemelo contra el RTL,
# la medición de CPI y la síntesis completa hasta el bitstream. Después se
# repite lo esencial con el core segmentado (make check-seg): prueba formal de
# que el core base no cambió, modelo de costo, riesgos, ejecución en paralelo,
# equivalencia de los 20 000 ticks y cierre de timing en 10 semillas. Y con el
# Espino barrel (make check-barrel): propiedades formales, pruebas de humo,
# comparación corta de cada hilo contra el Espino base, testbench oficial,
# equivalencia de los 20 000 ticks y cierre de timing en 10 semillas.
# La extensión de la ISA en custom-0 sobre el barrel (make check-xd) corre en
# un trabajo aparte, en paralelo: testbench de los módulos, prueba formal de
# cada instrucción contra su especificación, comparación corta contra el Espino
# base con la especificación, testbench oficial, equivalencia de los 20 000
# ticks y cierre de timing en 10 semillas.
# El fondo en un chip (make check-fondo), también en un trabajo aparte y una vez
# por peldaño (R1 con la tabla de parámetros, R2 con la tabla y el vigilante):
# pruebas de la referencia, testbench oficial con sw/fondo.s, y las versiones
# cortas de la equivalencia, del lote de series, del barrido de fases, de la
# degradación, de los controles negativos y de la matriz de estrés. Después las
# pruebas del vigilante (make check-vigilante).
# Usa la misma versión de OSS CAD Suite que usamos en el desarrollo.
#
# Los 20 000 ticks con Icarus, el simulador del testbench oficial, no corren
# en cada push porque son la parte más lenta. Quedan como ejecución manual:
# en la pestaña Actions con "Run workflow", o con
#   gh workflow run CI -f icarus_completo=true

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      icarus_completo:
        description: 'Correr también los 20 000 ticks con Icarus (make equiv-r3)'
        type: boolean
        default: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-09-06'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Versiones de las herramientas
        run: |
          yosys -V
          nextpnr-ice40 --version
          iverilog -V | head -1
          verilator --version
          python3 --version

      - name: Tests del ensamblador
        run: make test-asm

      - name: Tests del mercado y de la referencia
        run: make test-ref

      - name: Tests de los candidatos, del motor y de las familias calibradas
        run: make test-candidatos

      - name: trade.hex corresponde a trade.s
        run: make check-hex

      - name: Testbench oficial sin modificar (4/4)
        run: make tb

      - name: Equivalencia con la referencia (20 000 ticks, gemelo y Verilator)
        run: make -j4 equiv

      - name: Peor caso de respuesta en las 8 fases del sondeo (puerta, criterio 4)
        run: make fases

      - name: Tabla del punto 3.1 al día
        run: make tabla-3-1 && git diff --exit-code docs/mediciones/tabla_3_1.txt

      - name: Gemelo digital contra el RTL
        run: make cosim

      - name: El binario en el gemelo contra la referencia (3810 series)
        run: make equiv-gemelo

      - name: CPI y modelo de costo
        run: make cpi

      - name: Producto 2x2 en punto fijo contra su modelo
        run: make tb-mv2x2

      - name: Síntesis, place and route y bitstream
        run: make bin

      # --- Espino segmentado (pipeline de 3 etapas) ---
      - name: Core segmentado (modelo de costo, riesgos, paralelo, equivalencia y timing en 10 semillas)
        run: make check-seg

      # --- Espino barrel (4 hilos, pipeline de 4 etapas) ---
      - name: Core barrel (formal, humo, comparación corta contra el base, oficial 4/4, equivalencia y timing en 10 semillas)
        run: make check-barrel

  # Extensión de la ISA en custom-0 sobre el Espino barrel
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # la prueba formal compara contra el core del commit de P1,
                             # y R0 se reconstruye desde el suyo

      - name: Instalar OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-09-06'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: R0 se reproduce bit a bit desde su commit
        run: make r0-reproducir

      - name: Extensión de la ISA (módulos, formal, comparación corta, oficial 4/4, equivalencia y timing en 10 semillas)
        run: make check-xd BARREL_JOBS=4

  # Fondo en un chip: sw/fondo.s en los peldaños R1 y R2, y el vigilante
  fondo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-09-06'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fondo en R1 (referencia, tabla, oficial 4/4, equivalencia, series, fases, degradación, controles y estrés)
        run: make check-fondo HW=r1 FONDO_JOBS=4

      - name: Fondo en R2, con el vigilante (lo mismo; el vigilante no se debe disparar)
        run: make check-fondo HW=r2 FONDO_JOBS=4

      - name: Vigilante (testbench del módulo, formal y relevo de punta a punta)
        run: make check-vigilante

  # Ejecución manual: la corrida completa con el simulador del testbench oficial
  equiv-icarus:
    if: github.event_name == 'workflow_dispatch' && inputs.icarus_completo
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-09-06'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Equivalencia con la referencia (20 000 ticks, Icarus)
        run: make equiv-r3


  # Ejecución manual: verificación completa del core segmentado
  segmentado-completo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-09-06'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gemelo con --pipeline contra el RTL
        run: make cosim-seg

      - name: Controles negativos (mutaciones)
        run: make mutaciones

      - name: Ejecución en paralelo, 16 programas de 100 000 instrucciones
        run: make paralelo-largo

      - name: Equivalencia con la referencia, core segmentado y ROM
        run: make equiv-seg equiv-rom


  # Ejecución manual: verificación completa del core barrel (criterio 5 de la
  # puerta de simulación y pruebas complementarias)
  barrel-completo:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-09-06'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cada hilo contra el Espino base, mutaciones, aislamiento, memoria compartida y mediciones
        run: make barrel-completo BARREL_JOBS=4

      - name: Extensión de la ISA, campaña completa y mutaciones
        run: make xd-completo BARREL_JOBS=4
